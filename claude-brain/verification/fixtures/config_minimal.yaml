storage:
  mode: "synced"
  root_path: "/tmp/claude-brain-test"
  local_db_path: "/tmp/claude-brain-test/test.db"

jsonl:
  source_paths:
    - "/tmp/claude-brain-test/jsonl"
  ingest_subagents: true
  ingest_tool_results: true

jsonl_project_mapping:
  "project-alpha": "pa"
  "project-beta":  "pb"
  "claude-brain":  "cb"
  "general":       "gen"

projects:
  - folder_name: "project-alpha"
    prefix: "pa"
    label: "Project Alpha"
  - folder_name: "general"
    prefix: "gen"
    label: "General"
  - folder_name: "other"
    prefix: "oth"
    label: "Other"

backup:
  max_copies: 2
  verify_after_copy: true

semantic_search:
  enabled: false
  # Phase 2 (2026-05-27): aligned to live config (BGE-base, 768-dim).
  model: "BAAI/bge-base-en-v1.5"

logging:
  enabled: true
  level: "info"
